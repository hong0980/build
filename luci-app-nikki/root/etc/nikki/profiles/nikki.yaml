# 官方完整配置示例: https://github.com/MetaCubeX/mihomo/blob/Meta/docs/config.yaml

Anchor_PR: &Anchor_PR {type: http, interval: 86400, proxy: DIRECT, health-check: {enable: true, url: 'https://www.g.cn/generate_204', interval: 300}, filter: "^(?!.*(到期|过期|剩余|网址|官网|邮箱|订阅|套餐|流量|说明|重置|域名)).*$"}
# ================= 机场订阅 =================
proxy-providers:
#  机场名: {<<: *Anchor_PR, url: '订阅链接', override: {additional-prefix: '[机场名] '}}

mode: "rule"
ipv6: false
port: 7893
socks-port: 1080
mixed-port: 7890
redir-port: 7891
tproxy-port: 7892
allow-lan: true
bind-address: "*"
unified-delay: true
tcp-concurrent: true
keep-alive-idle: 600
keep-alive-interval: 15
log-level: "warning"
find-process-mode: "off"

dns:
  enable: true
  ipv6: false
  use-hosts: true
  cache-algorithm: arc
  listen: 0.0.0.0:1053
  respect-rules: true
  enhanced-mode: redir-host
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.0/16
  fake-ip-filter: ["rule-set:private_domain,cn_domain,fakeipfilter"]

  default-nameserver: ["223.5.5.5", "119.29.29.29"]
  nameserver: ["https://223.5.5.5/dns-query", "https://223.6.6.6/dns-query"]
  proxy-server-nameserver: ["https://223.5.5.5/dns-query", "https://223.6.6.6/dns-query"]
  nameserver-policy:
    'rule-set:ww_reject': "rcode://success"
    'rule-set:gfw_domain,geolocation-!cn': ["https://1.1.1.1/dns-query", "https://8.8.8.8/dns-query"]
    'rule-set:apple_domain,cn_domain,private_domain,pt_domain': ["https://223.5.5.5/dns-query", "https://223.6.6.6/dns-query"]

hosts:
  'dns.google': ['8.8.8.8', '8.8.4.4']
  'cloudflare-dns.com': ['1.1.1.1', '1.0.0.1']
  'services.googleapis.cn': ['services.googleapis.com']
  'openwrt.lan': lan
  'immortalwrt.lan': lan
  'lede.lan': lan
  'router.lan': lan
  'OpenWrt.lan': lan

sniffer:
  enable: true
  parse-pure-ip: true
  force-dns-mapping: true
  sniff:
    TLS: {ports: [443, 8443]}
    QUIC: {ports: [443, 8443]}
    HTTP: {ports: [80, 8080-8880], override-destination: true}
  force-domain: ["+.netflix.com", "+.nflxvideo.net", "+.amazonaws.com", "+.media.dssott.com"]
  skip-domain: [Mijia Cloud, dlg.io.mi.com, "+.oray.com", "+.sunlogin.net", "+.push.apple.com"]

# ================= 入站 Tun =================
tun:
  enable: true                        # 启用 Tun 虚拟网卡
  stack: mixed                        # Tun 协议栈实现
  dns-hijack: ["any:53", "tcp://any:53"] # 劫持所有 53 端口 DNS 请求到内置 DNS
  mtu: 1380                           # Tun 网卡 MTU
  auto-route: true                    # 自动配置路由表，将流量导入 Tun
  auto-redirect: true                 # 自动配置 iptables/nftables 重定向 TCP（仅 Linux，依赖 auto-route）
  auto-detect-interface: true         # 自动识别出口物理网卡，避免流量递归进 Tun

ntp:
  enable: true
  port: 123
  interval: 30
  write-to-system: false
  server: time.apple.com

profile:
  store-fake-ip: true                 # 持久化 fake-ip 映射表
  store-selected: true                # 记住策略组手动选择的节点

external-ui: ui                       # WebUI 目录
external-ui-name: Zashboard           # WebUI 名称
external-ui-url: https://github.com/Zephyruso/zashboard/releases/latest/download/dist-cdn-fonts.zip  # WebUI 下载地址
external-controller: '[::]:9090'      # RESTful API 监听地址
secret: "709777"                      # RESTful API 鉴权密钥
geodata-mode: false                   # false 使用 .dat 格式；true 需改用 .metadb（与 geox-url 对应）
geodata-loader: standard
geox-url:
  asn: https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/GeoLite2-ASN.mmdb
  mmdb: https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.metadb
  geoip: https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.dat
  geosite: https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geosite.dat

rules:
  # - DOMAIN-REGEX,.*\.(com|net|org|cn)\.lan,REJECT
  - RULE-SET,ww_reject,REJECT
  - RULE-SET,private_domain,🎯国内     # 局域网/内网保留域名国内
  - RULE-SET,cdn_cn,🎯国内
  - RULE-SET,pt_domain,🎯国内
  - RULE-SET,apple_domain,🎯国内
  - RULE-SET,claude_domain,🚀AI
  - RULE-SET,ai_domain,🚀AI
  - RULE-SET,bybit_domain,自动选择
  - RULE-SET,github_domain,自动选择
  - RULE-SET,youtube_domain,自动选择
  - RULE-SET,tiktok_domain,自动选择
  - RULE-SET,netflix_domain,自动选择
  - RULE-SET,disney_domain,自动选择
  - RULE-SET,telegram_domain,自动选择
  - RULE-SET,paypal_domain,自动选择
  - RULE-SET,gfw_domain,自动选择
  - RULE-SET,geolocation-!cn,自动选择
  - RULE-SET,cn_domain,🎯国内          # 国内域名国内
  - RULE-SET,cn_ip,🎯国内,no-resolve   # 国内 IP 段国内，不为此规则单独触发解析
  - MATCH,自动选择                      # 兜底规则，需放最后

proxies:
  - {name: 🎯国内, type: direct, udp: true, proxies: [DIRECT]}

.a: &select   {include-all: true, url: "https://www.gstatic.com/generate_204", type: select}
.b: &fallback {include-all: true, interval: 300, lazy: true, timeout: 2000, hidden: false, url: "https://www.gstatic.com/generate_204", type: fallback, max-failed-times: 3}
.c: &balance  {include-all: true, interval: 300, lazy: true, timeout: 2000, hidden: false, url: "https://www.gstatic.com/generate_204", type: load-balance, strategy: consistent-hashing}
.d: &urltest  {include-all: true, interval: 300, lazy: true, timeout: 2000, hidden: false, url: "https://www.gstatic.com/generate_204", type: url-test, tolerance: 50, max-failed-times: 3}

proxy-groups:
  # - {name: 故障转移, <<: *fallback, filter: "(?i)^(?!.*(国内)).*$", icon: https://testingcf.jsdelivr.net/gh/Seven1echo/Yaml@main/icons/Rocket.png}
  - {name: 自动选择, <<: *urltest, filter: "(?i)^(?!.*(国内)).*$", icon: https://testingcf.jsdelivr.net/gh/Seven1echo/Yaml@main/icons/Rocket.png}
  - {name: 🚀AI,    <<: *urltest, filter: "(?i)(台|日|美|新|韩)", icon: https://testingcf.jsdelivr.net/gh/Seven1echo/Yaml@main/icons/Claude.png}
  - {name: 香港自动, <<: *urltest, filter: "(?i)(香港|HK)", icon: https://testingcf.jsdelivr.net/gh/Seven1echo/Yaml@main/icons/HK.png}
  - {name: 日本自动, <<: *urltest, filter: "(?i)(日本|jp)", icon: https://testingcf.jsdelivr.net/gh/Seven1echo/Yaml@main/icons/JP.png}
  - {name: 台湾自动, <<: *urltest, filter: "(?i)(台湾|tw)", icon: https://testingcf.jsdelivr.net/gh/Seven1echo/Yaml@main/icons/TW.png}
  - {name: 美国自动, <<: *urltest, filter: "(?i)(美国|us)", icon: https://testingcf.jsdelivr.net/gh/Seven1echo/Yaml@main/icons/US.png}
  - {name: 狮城自动, <<: *urltest, filter: "(?i)(新加|sg)", icon: https://testingcf.jsdelivr.net/gh/Seven1echo/Yaml@main/icons/SG.png}
  - {name: 韩国自动, <<: *urltest, filter: "(?i)(韩国|🇰🇷)", icon: https://testingcf.jsdelivr.net/gh/Seven1echo/Yaml@main/icons/KR.png}
  - {name: 其他,     <<: *urltest, filter: "(?i)^(?!.*(港|HK|台|日|美|新|国内|韩)).*$", icon: https://testingcf.jsdelivr.net/gh/Seven1echo/Yaml@main/icons/OT.png}

.e: &base        {type: http, interval: 86400}
.g: &domain_ip   {<<: *base, behavior: ipcidr,    format: mrs}
.f: &domain_mrs  {<<: *base, behavior: domain,    format: mrs}
.h: &domain_yaml {<<: *base, behavior: domain,    format: yaml}
.i: &domain_text {<<: *base, behavior: domain,    format: text}
.j: &class       {<<: *base, behavior: classical, format: yaml}

rule-providers:
  cn_domain:       {<<: *domain_mrs,  url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/cn.mrs"}
  gfw_domain:      {<<: *domain_mrs,  url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/gfw.mrs"}
  apple_domain:    {<<: *domain_mrs,  url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/apple.mrs"}
  bybit_domain:    {<<: *domain_mrs,  url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/bybit.mrs"}
  disney_domain:   {<<: *domain_mrs,  url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/disney.mrs"}
  paypal_domain:   {<<: *domain_mrs,  url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/paypal.mrs"}
  tiktok_domain:   {<<: *domain_mrs,  url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/tiktok.mrs"}
  github_domain:   {<<: *domain_mrs,  url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/github.mrs"}
  private_domain:  {<<: *domain_mrs,  url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/private.mrs"}
  youtube_domain:  {<<: *domain_mrs,  url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/youtube.mrs"}
  netflix_domain:  {<<: *domain_mrs,  url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/netflix.mrs"}
  telegram_domain: {<<: *domain_mrs,  url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/telegram.mrs"}
  claude_domain:   {<<: *domain_mrs,  url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/anthropic.mrs"}
  pt_domain:       {<<: *domain_mrs,  url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/category-pt.mrs"}
  ai_domain:       {<<: *domain_mrs,  url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/category-ai-!cn.mrs"}
  cdn_cn:          {<<: *domain_mrs,  url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/category-cdn-cn.mrs"}
  geolocation-!cn: {<<: *domain_mrs,  url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/geolocation-!cn.mrs"}
  ww_reject:       {<<: *domain_mrs,  url: "https://testingcf.jsdelivr.net/gh/wwqgtxx/clash-rules@release/reject.mrs"}
  fakeipfilter:    {<<: *domain_text, url: "https://raw.githubusercontent.com/DustinWin/ShellCrash/refs/heads/dev/public/fake_ip_filter.list"}
  cn_ip:           {<<: *domain_ip,   url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geoip/cn.mrs"}
