# 官方完整配置示例: https://github.com/MetaCubeX/mihomo/blob/Meta/docs/config.yaml

Anchor_PR: &Anchor_PR {type: http, interval: 86400, proxy: DIRECT, health-check: {enable: true, url: 'https://www.g.cn/generate_204', interval: 300}, filter: "^(?!.*(到期|过期|剩余|网址|官网|邮箱|订阅|套餐|流量|说明|重置|域名)).*$"}
# ================= 机场订阅 =================
proxy-providers:
#  机场名: {<<: *Anchor_PR, url: '订阅链接', override: {additional-prefix: '[机场名] '}}

port: 7080
socks-port: 1080
mixed-port: 7890
redir-port: 7891
tproxy-port: 7892
allow-lan: true                      # 允许局域网设备接入代理端口/Tun
bind-address: "*"                    # 配合 allow-lan，监听所有网卡
mode: rule                           # 代理模式：rule / global / direct
ipv6: false                          # 全局 IPv6 开关，同时控制 DNS 是否解析 AAAA
unified-delay: true                  # 统一延迟计算方式，测速更准确
tcp-concurrent: true                 # 多个解析 IP 并发握手，取最快
log-level: warning                   # 日志等级：silent/error/warning/info/debug
keep-alive-idle: 600                 # TCP keepalive 空闲探测时间（秒）
keep-alive-interval: 15              # TCP keepalive 探测间隔（秒）

dns:
  enable: true
  ipv6: false
  cache-algorithm: arc
  listen: 0.0.0.0:1053
  respect-rules: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.0/16
  fake-ip-filter-mode: blacklist
  fake-ip-filter: ["rule-set:private_dm,cn_dm,fakeipfilter"]

  default-nameserver: [223.5.5.5, 119.29.29.29]
  nameserver: [https://223.5.5.5/dns-query, https://doh.pub/dns-query]
  proxy-server-nameserver: [https://223.5.5.5/dns-query, https://doh.pub/dns-query]
  nameserver-policy:
    'rule-set:ww_reject': rcode://success
    'rule-set:gfw_dm,geolocation-!cn': ['https://1.1.1.1/dns-query', https://8.8.8.8/dns-query]
    'rule-set:apple_dm,cn_dm,private_dm,pt_dm': [https://223.5.5.5/dns-query, https://223.6.6.6/dns-query]

# ================= 嗅探 =================
sniffer:
  enable: true                        # 启用流量嗅探（从 SNI/Host/QUIC 提取真实域名）
  sniff:
    HTTP:
      ports: [80, 8080-8880]          # 嗅探 HTTP Host 的端口范围
      override-destination: true      # 用嗅探结果覆盖实际连接目标
    TLS:
      ports: [443, 8443]              # 嗅探 TLS SNI 的端口范围
    QUIC:
      ports: [443, 8443]              # 嗅探 QUIC（HTTP/3）SNI 的端口范围
  # skip-dst-address:                 # 按目标 IP 跳过嗅探
  #   - 111.1.171.0/24
  #   - 39.174.182.0/23
#   force-domain:
#     - "+.v2ex.com"                    # 强制嗅探该域名
  skip-domain:                        # 跳过嗅探，改用连接真实 IP/端口判断规则
    ["rule-set:private_dm,cn_dm,fakeipfilter","Mijia Cloud","+.goofish.com","dlg.io.mi.com","+.push.apple.com","+.apple.com","+.wechat.com","+.qpic.cn","+.qq.com","+.wechatapp.com","+.vivox.com","+.oray.com","+.sunlogin.net","+.msftconnecttest.com","+.msftncsi.com","+.wql.us","+.keywordsstudios.cn"]

# ================= 入站 Tun =================
tun:
  enable: true                        # 启用 Tun 虚拟网卡
  stack: mixed                        # Tun 协议栈实现
  dns-hijack: ["any:53", "tcp://any:53"] # 劫持所有 53 端口 DNS 请求到内置 DNS
  mtu: 1380                           # Tun 网卡 MTU
  auto-route: true                    # 自动配置路由表，将流量导入 Tun
  auto-redirect: true                 # 自动配置 iptables/nftables 重定向 TCP（仅 Linux，依赖 auto-route）
  auto-detect-interface: true         # 自动识别出口物理网卡，避免流量递归进 Tun

profile:
  store-fake-ip: true                 # 持久化 fake-ip 映射表
  store-selected: true                # 记住策略组手动选择的节点

external-ui: ui                       # WebUI 目录
external-ui-name: Zashboard           # WebUI 名称
external-ui-url: https://github.com/Zephyruso/zashboard/releases/latest/download/dist-cdn-fonts.zip  # WebUI 下载地址
external-controller: '[::]:9090'      # RESTful API 监听地址
secret: "709777"                      # RESTful API 鉴权密钥
geodata-mode: false                   # false 使用 .dat 格式；true 需改用 .metadb（与 geox-url 对应）
geodata-loader: standard
geox-url:
  asn: https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/GeoLite2-ASN.mmdb
  mmdb: https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.metadb
  geoip: https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.dat
  geosite: https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geosite.dat

rules:
  # - DOMAIN-REGEX,.*\.(com|net|org|cn)\.lan,REJECT
  - RULE-SET,ww_reject,REJECT
  - RULE-SET,private_dm,🎯国内     # 局域网/内网保留域名国内
  - RULE-SET,cn_dm,🎯国内          # 国内域名国内
  - RULE-SET,cdn_cn,🎯国内
  - RULE-SET,pt_dm,🎯国内
  - RULE-SET,apple_dm,🎯国内
  - RULE-SET,claude_dm,🚀AI
  - RULE-SET,ai_dm,🚀AI
  - RULE-SET,bybit_dm,自动选择
  - RULE-SET,github_dm,自动选择
  - RULE-SET,youtube_dm,自动选择
  - RULE-SET,tiktok_dm,自动选择
  - RULE-SET,netflix_dm,自动选择
  - RULE-SET,disney_dm,自动选择
  - RULE-SET,telegram_dm,自动选择
  - RULE-SET,paypal_dm,自动选择
  - RULE-SET,gfw_dm,自动选择
  - RULE-SET,geolocation-!cn,自动选择
  - RULE-SET,cn_ip,🎯国内,no-resolve   # 国内 IP 段国内，不为此规则单独触发解析
  - MATCH,自动选择                      # 兜底规则，需放最后

proxies:
  - {name: 🎯国内, type: direct, udp: true, proxies: [DIRECT]}

.f: &select   {include-all: true, url: "https://www.gstatic.com/generate_204", type: select}
.g: &fallback {include-all: true, interval: 300, lazy: true, timeout: 2000, hidden: false, url: "https://www.gstatic.com/generate_204", type: fallback, max-failed-times: 3}
.h: &balance  {include-all: true, interval: 300, lazy: true, timeout: 2000, hidden: false, url: "https://www.gstatic.com/generate_204", type: load-balance, strategy: consistent-hashing}
.i: &urltest  {include-all: true, interval: 300, lazy: true, timeout: 2000, hidden: false, url: "https://www.gstatic.com/generate_204", type: url-test, tolerance: 50, max-failed-times: 3}

proxy-groups:
  - {name: 自动选择, <<: *urltest, filter: "(?i)^(?!.*(国内)).*$", icon: https://testingcf.jsdelivr.net/gh/Seven1echo/Yaml@main/icons/Rocket.png}
  - {name: 🚀AI,    <<: *urltest, filter: "(?i)(台|日|美|新|韩)", icon: https://testingcf.jsdelivr.net/gh/Seven1echo/Yaml@main/icons/Claude.png}
  - {name: 香港自动, <<: *urltest, filter: "(?i)(香港|HK)", icon: https://testingcf.jsdelivr.net/gh/Seven1echo/Yaml@main/icons/HK.png}
  - {name: 日本自动, <<: *urltest, filter: "(?i)(日本|jp)", icon: https://testingcf.jsdelivr.net/gh/Seven1echo/Yaml@main/icons/JP.png}
  - {name: 台湾自动, <<: *urltest, filter: "(?i)(台湾|tw)", icon: https://testingcf.jsdelivr.net/gh/Seven1echo/Yaml@main/icons/TW.png}
  - {name: 美国自动, <<: *urltest, filter: "(?i)(美国|us)", icon: https://testingcf.jsdelivr.net/gh/Seven1echo/Yaml@main/icons/US.png}
  - {name: 狮城自动, <<: *urltest, filter: "(?i)(新加|sg)", icon: https://testingcf.jsdelivr.net/gh/Seven1echo/Yaml@main/icons/SG.png}
  - {name: 韩国自动, <<: *urltest, filter: "(?i)(韩国|🇰🇷)", icon: https://testingcf.jsdelivr.net/gh/Seven1echo/Yaml@main/icons/KR.png}
  - {name: 其他,     <<: *urltest, filter: "(?i)^(?!.*(港|HK|台|日|美|新|国内|韩)).*$", icon: https://testingcf.jsdelivr.net/gh/Seven1echo/Yaml@main/icons/OT.png}

.a: &base        {type: http, interval: 86400}
.c: &domain      {<<: *base, behavior: domain,    format: mrs}
.b: &domain_ip   {<<: *base, behavior: ipcidr,    format: mrs}
.d: &domain_yaml {<<: *base, behavior: domain,    format: yaml}
.e: &class       {<<: *base, behavior: classical, format: yaml}

rule-providers:
  cn_dm:       {<<: *domain, url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/cn.mrs"}
  gfw_dm:      {<<: *domain, url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/gfw.mrs"}
  apple_dm:    {<<: *domain, url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/apple.mrs"}
  bybit_dm:    {<<: *domain, url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/bybit.mrs"}
  disney_dm:   {<<: *domain, url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/disney.mrs"}
  paypal_dm:   {<<: *domain, url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/paypal.mrs"}
  tiktok_dm:   {<<: *domain, url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/tiktok.mrs"}
  github_dm:   {<<: *domain, url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/github.mrs"}
  private_dm:  {<<: *domain, url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/private.mrs"}
  youtube_dm:  {<<: *domain, url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/youtube.mrs"}
  netflix_dm:  {<<: *domain, url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/netflix.mrs"}
  telegram_dm: {<<: *domain, url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/telegram.mrs"}
  claude_dm:   {<<: *domain, url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/anthropic.mrs"}
  pt_dm:       {<<: *domain, url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/category-pt.mrs"}
  ai_dm:       {<<: *domain, url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/category-ai-!cn.mrs"}
  cdn_cn:      {<<: *domain, url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/category-cdn-cn.mrs"}
  ww_reject:   {<<: *domain, url: "https://testingcf.jsdelivr.net/gh/wwqgtxx/clash-rules@release/reject.mrs"}
  fakeipfilter:    {<<: *domain_yaml, url: "https://raw.githubusercontent.com/juewuy/ShellCrash/refs/heads/dev/public/fake_ip_filter.list"}
  cn_ip:           {<<: *domain_ip,   url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geoip/cn.mrs"}
  geolocation-!cn: {<<: *domain,      url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/geolocation-!cn.mrs"}
