# https://github.com/qichiyuhub/rule/blob/main/config/mihomo/config/mihomo.yaml
# 必读！！！
# mihomo当前版本理论上较完美的分流准确同时防泄露专业版本（nikki，openclash等官方内核的都可以跑），如果用不明白，建议使用config.yaml
rule-anchor:
  P: &P {type: http, interval: 0, health-check: {enable: true, url: 'https://www.gstatic.com/generate_204', interval: 300}, exclude-filter: "官网|剩余|流量|套餐|订阅|直连|到期时间|GB|Expire Date|Traffic|ExpireDate", proxy: 直连}
  # 节点选择
  G1: &G1 {type: select, proxies: [默认代理, 香港故转, 日本故转, 台湾故转, 狮城故转, 美国故转, 香港手动, 日本手动, 台湾手动, 狮城手动, 美国手动, 香港自动, 日本自动, 台湾自动, 狮城自动, 美国自动, 全部自动, 全部手动, 直连]}
  S1: &S1 {type: select, proxies: [香港故转, 日本故转, 台湾故转, 狮城故转, 美国故转, 香港手动, 日本手动, 台湾手动, 狮城手动, 美国手动, 香港自动, 日本自动, 台湾自动, 狮城自动, 美国自动, 全部自动, 全部手动, 直连]}
  S2: &S2 {type: select, proxies: [日本故转, 香港故转, 台湾故转, 狮城故转, 美国故转, 香港手动, 日本手动, 台湾手动, 狮城手动, 美国手动, 香港自动, 日本自动, 台湾自动, 狮城自动, 美国自动, 全部自动, 全部手动, 直连]}
  S3: &S3 {type: select, proxies: [美国故转, 香港故转, 日本故转, 台湾故转, 狮城故转, 香港手动, 日本手动, 台湾手动, 狮城手动, 美国手动, 香港自动, 日本自动, 台湾自动, 狮城自动, 美国自动, 全部自动, 全部手动, 直连]}
  S4: &S4 {type: select, proxies: [狮城自动, 日本自动, 台湾自动, 美国自动, 全部自动, 全部手动]}
  S5: &S5 {type: url-test, proxies: [直连, DIRECT], interval: 3600, lazy: true, url: "http://connect.rom.miui.com/generate_204"}
  # 节点筛选
  HK: &HK "(?=.*(港|HK|(?i)Hong))^((?!(台|日|韩|新|深|美)).)*$"
  JP: &JP "(?=.*(日|JP|(?i)Japan))^((?!(港|台|韩|新|美)).)*$"
  TW: &TW "(?=.*(台|TW|(?i)Taiwan))^((?!(港|韩|新|美)).)*$"
  SG: &SG "(?=.*(新加坡|坡|狮城|SG|Singapore))^((?!(港|台|日|韩|ZJ)).)*$"
  US: &US "(?=.*(美|US|(?i)States|America))^((?!(港|台|日|韩|新)).)*$"
  El: &El "^((?!(官网|剩余|流量|套餐|订阅|到期时间|直连|GB|Expire Date|Traffic|ExpireDate)).)*$"
  # 策略组
  SD: &SD {type: select,   include-all: true}
  FB: &FB {type: fallback, include-all: true, interval: 300, lazy: true, url: 'https://www.gstatic.com/generate_204'}
  UT: &UT {type: url-test, include-all: true, interval: 300, lazy: true, tolerance: 50, hidden: true, url: 'https://www.gstatic.com/generate_204'}
  # ICON
  All:      &All "https://github.com/s0lnce/mofish-icon/raw/main/mihomo/pure/corner/all.png"
  Auto:     &Auto "https://github.com/s0lnce/mofish-icon/raw/main/mihomo/pure/corner/auto.png"
  Failover: &Failover "https://github.com/s0lnce/mofish-icon/raw/main/mihomo/pure/corner/failover.png"
  # 规则集
  Im: &Im {type: http, interval: 86400, behavior: ipcidr,    format: mrs}
  Dm: &Dm {type: http, interval: 86400, behavior: domain,    format: mrs}
  Dt: &Dt {type: http, interval: 86400, behavior: domain,    format: text}
  Dy: &Dy {type: http, interval: 86400, behavior: domain,    format: yaml}
  Ct: &Ct {type: http, interval: 86400, behavior: classical, format: text}
  Cy: &Cy {type: http, interval: 86400, behavior: classical, format: yaml}

proxy-providers:
  HH: {<<: *P, url: "订阅URL"}

proxies:
  - {name: 直连, type: direct, udp: true}

mixed-port: 7890
authentication:
- "user:passwd"
skip-auth-prefixes:
- 127.0.0.0/8
- 192.168.0.0/16
allow-lan: true
bind-address: "*"
ipv6: false
unified-delay: true
tcp-concurrent: true
log-level: info
keep-alive-idle: 600
keep-alive-interval: 15
profile:
  store-selected: true
  store-fake-ip: true

external-controller: 0.0.0.0:9090
secret: ""
external-ui: ui
external-ui-name: zashboard
external-ui-url: https://github.com/Zephyruso/zashboard/releases/latest/download/dist-cdn-fonts.zip

geodata-mode: false
geodata-loader: standard
geox-url:
  asn: https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/GeoLite2-ASN.mmdb
  mmdb: https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.metadb
  geoip: https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.dat
  geosite: https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geosite.dat

ntp:
  enable: true
  port: 123
  interval: 30
  write-to-system: true
  server: time.apple.com

tun:
  enable: true
  stack: mixed   ##如果内核版本大于v1.19.31，此处可以改为自研协议栈 mips ，理论上性能更好。
  dns-hijack: ["any:53", "tcp://any:53"]
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true
  # route-exclude-address-set:
  #   - cn_ip

sniffer:
  enable: true
  parse-pure-ip: true
  force-dns-mapping: false
  override-destination: false
  sniff:
    TLS:  {ports: [443, 8443]}
    QUIC: {ports: [443, 8443]}
    HTTP: {ports: [80, 8080-8880], override-destination: true}
  force-domain: ["+.netflix.com", "+.nflxvideo.net", "+.amazonaws.com", "+.media.dssott.com"]
  skip-domain: [Mijia Cloud, dlg.io.mi.com, "+.oray.com", "+.sunlogin.net", "+.push.apple.com"]

dns:
  enable: true
  cache-algorithm: arc
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-ttl: 1
  fake-ip-range: 198.18.0.0/16
  fake-ip-filter-mode: blacklist
  default-nameserver:
    - https://223.5.5.5/dns-query
  proxy-server-nameserver:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query
  direct-nameserver:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query
  nameserver-policy:
    "rule-set:China,private,fakeipfilter_cn,steamcn,applecn":
    - https://dns.alidns.com/dns-query#disable-qtype-65=true
    - https://doh.pub/dns-query#disable-qtype-65=true
    "rule-set:fakeipfilter_!cn":
    - https://8.8.8.8/dns-query#默认代理&disable-qtype-65=true
  nameserver:
    - https://8.8.8.8/dns-query#默认代理&ecs=223.5.5.0/24
  fallback:
    - https://8.8.8.8/dns-query#默认代理
  fallback-filter:
    geoip: true
    geoip-code: CN
  fake-ip-filter: [rule-set:fakeipfilter_cn,fakeipfilter_!cn,private,China,applecn,steamcn]


proxy-groups:
  - {name: YouTube,   <<: *S1, icon: "https://github.com/s0lnce/mofish-icon/raw/main/mihomo/pure/corner/youtube.png"}
  - {name: Google,    <<: *S1, icon: "https://github.com/s0lnce/mofish-icon/raw/main/mihomo/pure/corner/google.png"}
  - {name: GitHub,    <<: *S1, icon: "https://github.com/s0lnce/mofish-icon/raw/main/mihomo/pure/corner/github.png"}
  - {name: Steam,     <<: *S1, icon: "https://github.com/s0lnce/mofish-icon/raw/main/mihomo/pure/corner/steam.png"}
  - {name: Apple,     <<: *S1, icon: "https://github.com/s0lnce/mofish-icon/raw/main/mihomo/pure/corner/apple.png"}
  - {name: Telegram,  <<: *S1, icon: "https://github.com/s0lnce/mofish-icon/raw/main/mihomo/pure/corner/telegram.png"}
  - {name: 默认代理,   <<: *S1, icon: "https://github.com/s0lnce/mofish-icon/raw/main/mihomo/pure/corner/select.png"}
  # - {name: Microsoft, <<: *S2, icon: "https://github.com/s0lnce/mofish-icon/raw/main/mihomo/pure/corner/microsoft.png"}
  - {name: OneDrive,  <<: *S2, icon: "https://github.com/s0lnce/mofish-icon/raw/main/mihomo/pure/corner/onedrive.png"}
  - {name: TikTok,    <<: *S3, icon: "https://github.com/s0lnce/mofish-icon/raw/main/mihomo/pure/corner/douyin.png"}
  - {name: NETFLIX,   <<: *S3, icon: "https://github.com/s0lnce/mofish-icon/raw/main/mihomo/pure/corner/netflix.png"}
  - {name: Wallet,    <<: *S3, icon: "https://github.com/s0lnce/mofish-icon/raw/main/mihomo/pure/corner/wallet.png"}
  - {name: AI,        <<: *S4, icon: "https://github.com/s0lnce/mofish-icon/raw/main/mihomo/pure/corner/ai.png"}
  - {name: GLOBAL,    <<: *G1, icon: "https://github.com/s0lnce/mofish-icon/raw/main/mihomo/pure/corner/all.png"}
  - {name: 漏网之鱼,   <<: *G1, icon: "https://github.com/s0lnce/mofish-icon/raw/main/mihomo/pure/corner/final.png"}
  - {name: 香港手动,   <<: *SD, filter: *HK, icon: "https://github.com/s0lnce/mofish-icon/raw/main/mihomo/flag/corner/hongkong.png"}
  - {name: 日本手动,   <<: *SD, filter: *JP, icon: "https://github.com/s0lnce/mofish-icon/raw/main/mihomo/flag/corner/japan.png"}
  - {name: 台湾手动,   <<: *SD, filter: *TW, icon: "https://github.com/s0lnce/mofish-icon/raw/main/mihomo/flag/corner/taiwan.png"}
  - {name: 狮城手动,   <<: *SD, filter: *SG, icon: "https://github.com/s0lnce/mofish-icon/raw/main/mihomo/flag/corner/singapore.png"}
  - {name: 美国手动,   <<: *SD, filter: *US, icon: "https://github.com/s0lnce/mofish-icon/raw/main/mihomo/flag/corner/usa.png"}
  - {name: 香港故转,   <<: *FB, filter: *HK, icon: *Failover}
  - {name: 日本故转,   <<: *FB, filter: *JP, icon: *Failover}
  - {name: 台湾故转,   <<: *FB, filter: *TW, icon: *Failover}
  - {name: 狮城故转,   <<: *FB, filter: *SG, icon: *Failover}
  - {name: 美国故转,   <<: *FB, filter: *US, icon: *Failover}
  - {name: 香港自动,   <<: *UT, filter: *HK, icon: *Auto}
  - {name: 日本自动,   <<: *UT, filter: *JP, icon: *Auto}
  - {name: 台湾自动,   <<: *UT, filter: *TW, icon: *Auto}
  - {name: 狮城自动,   <<: *UT, filter: *SG, icon: *Auto}
  - {name: 美国自动,   <<: *UT, filter: *US, icon: *Auto}
  - {name: 全部自动,   <<: *UT, filter: *El, icon: *Auto}
  - {name: 全部手动,   <<: *SD, filter: *El, icon: *All}
  - {name: 延迟辅助,   <<: *S5, icon: *Auto}

rules:
  - AND,((RULE-SET,Proxy),(DST-PORT,443),(NETWORK,UDP)),REJECT
  - RULE-SET,private_ip,直连,no-resolve
  - RULE-SET,cpt,直连
  - RULE-SET,Download,直连
  - RULE-SET,China,直连
  - RULE-SET,ai,AI
  - RULE-SET,youtube,YouTube
  - RULE-SET,google,Google
  - RULE-SET,github,GitHub
  - RULE-SET,telegram,Telegram
  - RULE-SET,tiktok,TikTok
  - RULE-SET,onedrive,OneDrive
  # - RULE-SET,microsoftcn,直连
  # - RULE-SET,microsoft,Microsoft
  - RULE-SET,applecn,直连
  - RULE-SET,apple,Apple
  - RULE-SET,netflix,NETFLIX
  - RULE-SET,paypal,Wallet
  - RULE-SET,binance,Wallet
  - RULE-SET,okx,Wallet
  - RULE-SET,usd,Wallet
  - RULE-SET,steamcn,直连
  - RULE-SET,steam,Steam
  - RULE-SET,Proxy,默认代理
  - RULE-SET,google_ip,Google
  - RULE-SET,apple_ip,Apple
  - RULE-SET,telegram_ip,Telegram
  - RULE-SET,netflix_ip,NETFLIX
  - RULE-SET,cn_ip,直连
  - MATCH,漏网之鱼

