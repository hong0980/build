# https://github.com/qichiyuhub/rule/blob/main/config/mihomo/config/mihomo.yaml
# 必读！！！
# mihomo当前版本理论上较完美的分流准确同时防泄露专业版本（nikki，openclash等官方内核的都可以跑），如果用不明白，建议使用config.yaml
# 因为DNS流程较多，尽可能用本地搭建DNS开启乐观缓存。
# 因为配置里开启了绕过大陆，google商店会无法更新，可以尝试把 "+.googleapis.cn"  "+.xn--ngstr-lra8j.com" 两个域名后缀指定走国外DNS，同时rules里添加走代理，理论上可以解决，或者关闭绕过大陆。
rule-anchor:
  # 节点选择
  G1: &G1 {type: select, proxies: [默认代理]}
  S1: &S1 {type: select, proxies: [香港自动, 日本自动, 台湾自动, 狮城自动, 美国自动, 香港手动, 日本手动, 台湾手动, 狮城手动, 美国手动, 全部自动, 全部手动, 国内流量]}
  S2: &S2 {type: select, proxies: [日本自动, 台湾自动, 狮城自动, 美国自动, 香港自动, 日本手动, 台湾手动, 狮城手动, 美国手动, 香港手动, 全部自动, 全部手动, 国内流量]}
  S3: &S3 {type: select, proxies: [台湾自动, 狮城自动, 美国自动, 香港自动, 日本自动, 台湾手动, 狮城手动, 美国手动, 香港手动, 日本手动, 全部自动, 全部手动, 国内流量]}
  S4: &S4 {type: select, proxies: [狮城自动, 香港自动, 美国自动, 日本自动, 台湾自动, 狮城手动, 美国手动, 香港手动, 日本手动, 台湾手动, 全部自动, 全部手动, 国内流量]}
  S5: &S5 {type: select, proxies: [美国自动, 香港自动, 日本自动, 台湾自动, 狮城自动, 美国手动, 香港手动, 日本手动, 台湾手动, 狮城手动, 全部自动, 全部手动, 国内流量]}
  S6: &S6 {type: url-test, proxies: [国内流量, DIRECT], interval: 3600, lazy: true, url: "http://connect.rom.miui.com/generate_204"}
  # 节点筛选
  HK: &HK "(?=.*(港|HK|(?i)Hong))^((?!(台|日|韩|新|深|美)).)*$"
  JP: &JP "(?=.*(日|JP|(?i)Japan))^((?!(港|台|韩|新|美)).)*$"
  TW: &TW "(?=.*(台|TW|(?i)Taiwan))^((?!(港|韩|新|美)).)*$"
  SG: &SG "(?=.*(新加坡|坡|狮城|SG|Singapore))^((?!(港|台|日|韩|ZJ)).)*$"
  US: &US "(?=.*(美|US|(?i)States|America))^((?!(港|台|日|韩|新)).)*$"
  El: &El "^((?!(官网|剩余|流量|套餐|订阅|到期时间|域名)).)*$"
  # 策略组
  SD: &SD {type: select,   include-all: true, empty-fallback: REJECT}
  UL: &UL {type: url-test, include-all: true, empty-fallback: REJECT, interval: 300, lazy: true, url: 'https://www.gstatic.com/generate_204', tolerance: 50}
  # ICON
  Fl:   &Fl   https://github.com/s0lnce/mofish-icon/raw/main/mihomo/pure/corner/failover.png
  All:  &All  https://github.com/s0lnce/mofish-icon/raw/main/mihomo/pure/corner/all.png
  Auto: &Auto https://github.com/s0lnce/mofish-icon/raw/main/mihomo/pure/corner/auto.png
  # 规则集
  Im: &Im {type: http, interval: 86400, behavior: ipcidr,    format: mrs}
  Dm: &Dm {type: http, interval: 86400, behavior: domain,    format: mrs}
  Dt: &Dt {type: http, interval: 86400, behavior: domain,    format: text}
  Dy: &Dy {type: http, interval: 86400, behavior: domain,    format: yaml}
  Ct: &Ct {type: http, interval: 86400, behavior: classical, format: text}
  Cy: &Cy {type: http, interval: 86400, behavior: classical, format: yaml}
  pu: &pu [https://doh.pub/dns-query, https://dns.alidns.com/dns-query]
  go: &go [https://cloudflare-dns.com/dns-query, https://dns.google/dns-query]
  P: &P {type: http, interval: 86400, health-check: {enable: true, url: 'https://www.gstatic.com/generate_204', interval: 300}, filter: *El, proxy: 国内流量}

proxy-providers:
  订阅1: {<<: *P, url: "订阅URL"}
  订阅2: {<<: *P, url: "订阅URL"}

proxies: [{name: 国内流量, type: direct, udp: true}]
mixed-port: 7890
authentication: ["user:passwd"]
skip-auth-prefixes: [127.0.0.0/8, 192.168.0.0/16]
allow-lan: true
bind-address: "*"
ipv6: false
unified-delay: true
tcp-concurrent: true
log-level: info
keep-alive-idle: 600
keep-alive-interval: 15
profile:
  store-selected: true
  store-fake-ip: true

external-controller: 0.0.0.0:9090
secret: ""
external-ui: ui
external-ui-name: zashboard
external-ui-url: https://github.com/Zephyruso/zashboard/releases/latest/download/dist-cdn-fonts.zip

geox-url:
  mmdb: https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/country.mmdb

ntp:
  enable: true
  port: 123
  interval: 30
  write-to-system: true
  server: time.apple.com

tun:
  enable: true
  stack: mixed
  dns-hijack: ["any:53", "tcp://any:53"]
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true
  route-exclude-address-set: [cnIP]

sniffer:
  enable: true
  sniff:
    TLS:  {ports: [443, 8443]}
    QUIC: {ports: [443, 8443]}
    HTTP: {ports: [80, 8080-8880], override-destination: true}
  skip-domain:
    - "Mijia Cloud"
    - "+.push.apple.com"

dns:
  enable: true
  ipv6: false
  cache-algorithm: arc
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.0/16
  fake-ip-filter-mode: rule
  default-nameserver: [223.5.5.5, 223.6.6.6]
  direct-nameserver: *pu
  proxy-server-nameserver: *pu
  nameserver-policy:
    "rule-set:ads": rcode://success
    "rule-set:cn,Private,Direct": *pu
    "rule-set:cn!": *go
  nameserver: *go
  fallback: *go
  fallback-filter:
    geoip: true
    geoip-code: CN
  fake-ip-filter:
    - RULE-SET,Private,real-ip
    - RULE-SET,cn,real-ip
    - RULE-SET,Fifilter,real-ip
    - MATCH,fake-ip

proxy-groups:
  - {name: Telegram, <<: *S1, icon: https://github.com/s0lnce/mofish-icon/raw/main/mihomo/pure/corner/telegram.png}
  - {name: 默认代理,  <<: *S1, icon: https://github.com/s0lnce/mofish-icon/raw/main/mihomo/pure/corner/select.png}
  - {name: 开发服务,  <<: *S1, icon: https://github.com/s0lnce/mofish-icon/raw/main/mihomo/pure/corner/github.png}
  - {name: Steam,    <<: *S1, icon: https://github.com/s0lnce/mofish-icon/raw/main/mihomo/pure/corner/steam.png}
  - {name: Apple,    <<: *S1, icon: https://github.com/s0lnce/mofish-icon/raw/main/mihomo/pure/corner/apple.png}
  - {name: Google,   <<: *S1, icon: https://github.com/s0lnce/mofish-icon/raw/main/mihomo/pure/corner/google.png}
  - {name: NETFLIX,  <<: *S3, icon: https://github.com/s0lnce/mofish-icon/raw/main/mihomo/pure/corner/netflix.png}
  - {name: AI,       <<: *S2, icon: https://github.com/s0lnce/mofish-icon/raw/main/mihomo/pure/corner/ai.png}
  - {name: GLOBAL,   <<: *G1, icon: https://github.com/s0lnce/mofish-icon/raw/main/mihomo/pure/corner/all.png}
  - {name: 漏网之鱼,  <<: *G1, icon: https://github.com/s0lnce/mofish-icon/raw/main/mihomo/pure/corner/final.png}
  - {name: 国际媒体,  <<: *S4, icon: https://github.com/Koolson/Qure/raw/master/IconSet/Color/DomesticMedia.png}
  - {name: 香港手动,  <<: *SD, filter: *HK, icon: https://github.com/s0lnce/mofish-icon/raw/main/mihomo/flag/corner/hongkong.png}
  - {name: 日本手动,  <<: *SD, filter: *JP, icon: https://github.com/s0lnce/mofish-icon/raw/main/mihomo/flag/corner/japan.png}
  - {name: 台湾手动,  <<: *SD, filter: *TW, icon: https://github.com/s0lnce/mofish-icon/raw/main/mihomo/flag/corner/taiwan.png}
  - {name: 狮城手动,  <<: *SD, filter: *SG, icon: https://github.com/s0lnce/mofish-icon/raw/main/mihomo/flag/corner/singapore.png}
  - {name: 美国手动,  <<: *SD, filter: *US, icon: https://github.com/s0lnce/mofish-icon/raw/main/mihomo/flag/corner/usa.png}
  - {name: 香港自动,  <<: *UL, filter: *HK, icon: *Auto}
  - {name: 日本自动,  <<: *UL, filter: *JP, icon: *Auto}
  - {name: 台湾自动,  <<: *UL, filter: *TW, icon: *Auto}
  - {name: 狮城自动,  <<: *UL, filter: *SG, icon: *Auto}
  - {name: 美国自动,  <<: *UL, filter: *US, icon: *Auto}
  - {name: 全部手动,  <<: *SD, filter: *El, icon: *All}
  - {name: 全部自动,  <<: *UL, filter: *El, icon: *Auto}

rules:
  - RULE-SET,Tracking,REJECT
  - RULE-SET,ads,REJECT
  - AND,((RULE-SET,cn!),(DST-PORT,443),(NETWORK,UDP)),REJECT
  - RULE-SET,Private,国内流量
  - RULE-SET,Direct,国内流量
  - RULE-SET,pt,国内流量
  - RULE-SET,Gemini,美国自动
  - RULE-SET,Claude,美国自动
  - RULE-SET,ai,AI
  - RULE-SET,Dev,开发服务
  - RULE-SET,Streaming,国际媒体
  - RULE-SET,google,Google
  - RULE-SET,applecn,国内流量
  - RULE-SET,apple,Apple
  - RULE-SET,telegram,Telegram
  - RULE-SET,netflix,NETFLIX
  - RULE-SET,steamcn,国内流量
  - RULE-SET,steam,Steam
  - RULE-SET,cn,国内流量
  - RULE-SET,cdn-!cn,默认代理
  - RULE-SET,cn!,默认代理

  - RULE-SET,AdvertisingIP,REJECT,no-resolve
  - RULE-SET,PrivateIP,国内流量,no-resolve
  - RULE-SET,google_ip,Google,no-resolve
  - RULE-SET,apple_ip,Apple,no-resolve
  - RULE-SET,telegram_ip,Telegram,no-resolve
  - RULE-SET,netflix_ip,NETFLIX,no-resolve
  - RULE-SET,StreamingIP,国际媒体,no-resolve
  - RULE-SET,cnIP,国内流量,no-resolve
  - RULE-SET,ProxyIP,默认代理,no-resolve
  - MATCH,漏网之鱼

